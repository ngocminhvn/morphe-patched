name: Build YouTube Morphe CorePatch
run-name: YouTube Morphe CorePatch • ${{ inputs.morphe_patches_version }}

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: Direct public URL to original YouTube APK/APKM/APKS/XAPK
        required: true
        type: string
      source_format:
        description: Source file format
        required: true
        default: apkm
        type: choice
        options:
          - apk
          - apkm
          - apks
          - xapk
      expected_sha256:
        description: Optional SHA-256 of source
        required: false
        type: string
      morphe_patches_version:
        description: Morphe patches tag, e.g. v1.45.0 or latest
        required: true
        default: v1.45.0
        type: string
      morphe_desktop_version:
        description: Morphe Desktop tag, e.g. v1.18.0 or latest
        required: true
        default: v1.18.0
        type: string
      keep_archs:
        description: Native architectures to keep, comma-separated
        required: true
        default: arm64-v8a
        type: string
      extra_disable:
        description: Extra patch names to disable, comma-separated
        required: false
        type: string
      extra_enable:
        description: Extra patch names to enable, comma-separated
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: morphe-youtube-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Patch YouTube
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Download original YouTube source
        shell: bash
        env:
          SOURCE_URL: ${{ inputs.source_url }}
          SOURCE_FORMAT: ${{ inputs.source_format }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p input
          target="input/youtube-original.${SOURCE_FORMAT}"

          curl -fL             --retry 5             --retry-delay 2             --connect-timeout 30             -A 'Mozilla/5.0'             -o "$target"             "$SOURCE_URL"

          test -s "$target"
          ls -lh "$target"
          sha256sum "$target"

          if [[ -n "$EXPECTED_SHA256" ]]; then
            echo "$EXPECTED_SHA256  $target" | sha256sum -c -
          fi

      - name: Patch with Morphe
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_FILE: ${{ github.workspace }}/input/youtube-original.${{ inputs.source_format }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
          MORPHE_PATCHES_VERSION: ${{ inputs.morphe_patches_version }}
          MORPHE_DESKTOP_VERSION: ${{ inputs.morphe_desktop_version }}
          KEEP_ARCHS: ${{ inputs.keep_archs }}
          EXTRA_DISABLE: ${{ inputs.extra_disable }}
          EXTRA_ENABLE: ${{ inputs.extra_enable }}
          JAVA_XMX: 6g
        run: bash scripts/build.sh

      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo '## YouTube Morphe CorePatch'
            if compgen -G 'dist/*.apk' > /dev/null; then
              echo '✅ Build succeeded'
              echo
              echo '### Identity'
              echo '- package: `com.google.android.youtube`'
              echo '- icon: original YouTube'
              echo '- GmsCore support: OFF'
              echo '- Spoof signature: OFF'
              echo '- Custom branding: OFF'
              echo
              echo '### Build info'
              echo '```'
              cat dist/build-info.txt || true
              cat dist/*.sha256 || true
              echo '```'
            else
              echo '❌ Build failed before a verified APK was produced.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verified APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-Morphe-CorePatch
          path: dist/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            work/patch.log
            work/report.json
          retention-days: 3
          if-no-files-found: ignore
