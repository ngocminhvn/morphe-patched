name: Morphe Multi-App Builder
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Build {0} from URL', inputs.app) || github.event_name == 'schedule' && 'Sync + auto-build stable apps' || 'Validate builder' }}

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build.yml'
      - 'scripts/**'
      - 'config/**'
      - 'README.md'
      - 'SUPPORTED.md'
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      app:
        description: App to patch
        required: true
        default: youtube
        type: choice
        options:
          - youtube
          - youtube-music
          - reddit
      source_url:
        description: Direct APK/APKM link or supported APKMirror release/variant/download page
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: morphe-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate repository
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/build.sh
          python3 -m py_compile scripts/apk_sigblock.py
          python3 -m py_compile scripts/fetch_source.py
          python3 -m py_compile scripts/update_supported.py
          grep -F '"GmsCore support"' scripts/build.sh
          grep -F '"Clone app"' scripts/build.sh
          grep -F '"Spoof signature"' scripts/build.sh
          grep -F '"Custom branding"' scripts/build.sh
          grep -F '"App icon"' scripts/build.sh
          grep -F '"youtube-music"' scripts/update_supported.py
          grep -F '"reddit"' scripts/update_supported.py

      - name: Validate latest Morphe release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          api() {
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$1"
          }

          desktop_json="$(api https://api.github.com/repos/MorpheApp/morphe-desktop/releases/latest)"
          patches_json="$(api https://api.github.com/repos/MorpheApp/morphe-patches/releases/latest)"

          desktop_tag="$(jq -r '.tag_name // empty' <<< "$desktop_json")"
          desktop_asset="$(jq -r '[.assets[]? | select(.name | endswith("-all.jar")) | .name][0] // empty' <<< "$desktop_json")"
          patches_tag="$(jq -r '.tag_name // empty' <<< "$patches_json")"
          patches_asset="$(jq -r '[.assets[]? | select(.name | endswith(".mpp")) | .name][0] // empty' <<< "$patches_json")"

          test -n "$desktop_tag"
          test -n "$desktop_asset"
          test -n "$patches_tag"
          test -n "$patches_asset"

          echo "Morphe Desktop: $desktop_tag / $desktop_asset"
          echo "Morphe patches: $patches_tag / $patches_asset"

      - name: Validate support metadata for all apps
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for app in youtube youtube-music reddit; do
            python3 scripts/update_supported.py \
              --app "$app" \
              --output "/tmp/$app.md" \
              --json-output "/tmp/$app.json"
            jq -e '.versions | length > 0' "/tmp/$app.json" >/dev/null
          done

  sync-supported:
    name: Sync supported versions
    if: github.event_name == 'schedule' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate SUPPORTED.md from latest Morphe release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_supported.py --output SUPPORTED.md

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- SUPPORTED.md; then
            echo "SUPPORTED.md is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SUPPORTED.md
          git commit -m "docs: sync Morphe supported app versions"
          git push

  build:
    name: Patch ${{ matrix.app }}
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'push') && (needs.validate.result == 'success' || needs.validate.result == 'skipped') }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(github.event_name == 'schedule' && '["youtube","youtube-music","reddit"]' || github.event_name == 'push' && '["youtube"]' || format('["{0}"]', inputs.app)) }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve build target
        id: plan
        shell: bash
        env:
          APP: ${{ matrix.app }}
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_SOURCE_URL: ${{ inputs.source_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            test -n "$MANUAL_SOURCE_URL"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "source_url=$MANUAL_SOURCE_URL" >> "$GITHUB_OUTPUT"
            echo "reason=manual" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python3 scripts/update_supported.py \
            --app "$APP" \
            --output "/tmp/$APP-supported.md" \
            --json-output "/tmp/$APP-support.json"

          version="$(jq -r '[.versions[] | select(.experimental == false)][0].version // empty' "/tmp/$APP-support.json")"
          patches_tag="$(jq -r '.patchesTag // empty' "/tmp/$APP-support.json")"
          test -n "$version"
          test -n "$patches_tag"

          version_slug="${version//./-}"
          case "$APP" in
            youtube)
              source_url="https://www.apkmirror.com/apk/google-inc/youtube/youtube-${version_slug}-release/"
              ;;
            youtube-music)
              source_url="https://www.apkmirror.com/apk/google-inc/youtube-music/youtube-music-${version_slug}-release/"
              ;;
            reddit)
              source_url="https://www.apkmirror.com/apk/redditinc/reddit/reddit-${version_slug}-release/"
              ;;
            *)
              echo "Unsupported APP: $APP" >&2
              exit 2
              ;;
          esac

          patch_version="${patches_tag#v}"
          tag="${APP}-${version}-morphe-${patch_version}"

          echo "target_version=$version" >> "$GITHUB_OUTPUT"
          echo "patches_tag=$patches_tag" >> "$GITHUB_OUTPUT"
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "source_url=$source_url" >> "$GITHUB_OUTPUT"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "reason=release-exists" >> "$GITHUB_OUTPUT"
            echo "$APP $version with Morphe $patches_tag is already released; skipping."
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "reason=new-stable-target" >> "$GITHUB_OUTPUT"
            echo "New target: $APP $version with Morphe $patches_tag"
            echo "Source: $source_url"
          fi

      - name: Setup Java 21
        if: steps.plan.outputs.should_build == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Resolve and download source
        if: steps.plan.outputs.should_build == 'true'
        id: source
        shell: bash
        env:
          APP: ${{ matrix.app }}
          SOURCE_URL: ${{ steps.plan.outputs.source_url }}
        run: |
          set -euo pipefail
          python3 scripts/fetch_source.py "$SOURCE_URL" \
            --output-dir input \
            --name "$APP-original" | tee source.env
          cat source.env >> "$GITHUB_OUTPUT"
          source source.env
          sha256sum "$SOURCE_FILE"
          ls -lh "$SOURCE_FILE"

      - name: Patch with latest Morphe release
        if: steps.plan.outputs.should_build == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APP: ${{ matrix.app }}
          SOURCE_FILE: ${{ steps.source.outputs.SOURCE_FILE }}
          JAVA_XMX: 6g
        run: bash scripts/build.sh

      - name: Read build metadata
        if: steps.plan.outputs.should_build == 'true'
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          cat dist/build-info.env >> "$GITHUB_OUTPUT"

      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Morphe CorePatch'
            if [[ "${{ steps.plan.outputs.should_build }}" != "true" ]]; then
              echo '✅ Already current — build skipped'
              echo
              echo '- App: `${{ matrix.app }}`'
              echo '- Stable target: `${{ steps.plan.outputs.target_version }}`'
              echo '- Morphe patches: `${{ steps.plan.outputs.patches_tag }}`'
              echo '- Existing release: `${{ steps.plan.outputs.release_tag }}`'
            elif [[ -f dist/build-info.txt ]]; then
              echo '✅ Build succeeded'
              echo
              echo '### Build info'
              echo '~~~'
              cat dist/build-info.txt
              echo '~~~'
              echo
              echo 'Package, original certificate identity and original launcher icon are preserved.'
            else
              echo '❌ Build failed before a verified APK was produced.'
              echo
              echo 'Scheduled builds will retry automatically on the next 6-hour check.'
              echo 'Check SUPPORTED.md and APKMirror availability for the selected stable target.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Actions artifact
        if: success() && steps.plan.outputs.should_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.APP_SLUG }}-${{ steps.meta.outputs.APP_VERSION }}-Morphe
          path: dist/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Create or update GitHub Release
        if: success() && steps.plan.outputs.should_build == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APP_KEY: ${{ steps.meta.outputs.APP_KEY }}
          APP_NAME: ${{ steps.meta.outputs.APP_NAME }}
          APP_SLUG: ${{ steps.meta.outputs.APP_SLUG }}
          PACKAGE_NAME: ${{ steps.meta.outputs.PACKAGE_NAME }}
          APP_VERSION: ${{ steps.meta.outputs.APP_VERSION }}
          EXPERIMENTAL: ${{ steps.meta.outputs.EXPERIMENTAL }}
          MORPHE_PATCHES_TAG: ${{ steps.meta.outputs.MORPHE_PATCHES_TAG }}
          MORPHE_DESKTOP_TAG: ${{ steps.meta.outputs.MORPHE_DESKTOP_TAG }}
          SOURCE_SHA256: ${{ steps.meta.outputs.SOURCE_SHA256 }}
          APK_SHA256: ${{ steps.meta.outputs.APK_SHA256 }}
        run: |
          set -euo pipefail

          patch_version="${MORPHE_PATCHES_TAG#v}"
          tag="${APP_SLUG}-${APP_VERSION}-morphe-${patch_version}"
          title="${APP_NAME} ${APP_VERSION} • Morphe ${MORPHE_PATCHES_TAG}"

          status="Stable"
          if [[ "$EXPERIMENTAL" == "true" ]]; then
            status="Experimental"
          fi

          cat > release-notes.md <<EOF
          - Morphe patches: **${MORPHE_PATCHES_TAG}** (latest at build time)
          - Morphe Desktop: **${MORPHE_DESKTOP_TAG}**
          - Morphe support status: **${status}**
          EOF

          prerelease_args=()
          if [[ "$EXPERIMENTAL" == "true" ]]; then
            prerelease_args+=(--prerelease)
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$title" --notes-file release-notes.md
            gh release upload "$tag" dist/*.apk --clobber

            while IFS= read -r asset; do
              [[ -z "$asset" || "$asset" == *.apk ]] && continue
              gh release delete-asset "$tag" "$asset" --yes
            done < <(gh release view "$tag" --json assets --jq '.assets[].name')
          else
            gh release create "$tag" \
              dist/*.apk \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes-file release-notes.md \
              "${prerelease_args[@]}"
          fi

      - name: Upload diagnostics
        if: failure() && steps.plan.outputs.should_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics-${{ matrix.app }}
          path: |
            source.env
            work/patch.log
            work/report.json
            work/support.json
          retention-days: 3
          if-no-files-found: ignore
