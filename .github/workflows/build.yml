name: Morphe Multi-App Builder
run-name: ${{ github.event_name == 'schedule' && 'Daily Morphe Stable check' || github.event_name == 'workflow_dispatch' && 'Manual Stable check' || 'Validate Morphe builder' }}

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'scripts/**'
      - 'tests/**'
      - 'config/**'
      - 'README.md'
      - 'SUPPORTED.md'
  schedule:
    # 09:13 GMT+7 = 02:13 UTC, once daily.
    - cron: '13 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: morphe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate builder scripts
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and regression tests
        run: |
          set -euo pipefail
          bash -n scripts/build.sh scripts/publish_release.sh
          python3 -m compileall -q scripts
          python3 -m unittest discover -s tests -p 'test_*.py'

  check:
    name: Compare Morphe Stable versions with published APKs
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.plan.outputs.should_build }}
      mode: ${{ steps.plan.outputs.mode }}
      apps: ${{ steps.plan.outputs.apps }}
      targets: ${{ steps.plan.outputs.targets }}
      patches_tag: ${{ steps.plan.outputs.patches_tag }}
      release_tag: ${{ steps.plan.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Compare upstream Stable support and release assets
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/update_supported.py \
            --output /tmp/supported.md \
            --json-output /tmp/supported.json
          patches_tag="$(jq -er '.patchesTag' /tmp/supported.json)"
          release_tag="morphe-${patches_tag#v}"
          http_code="$(curl -sS --retry 3 -o /tmp/release.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$release_tag")"
          case "$http_code" in
            200) ;;
            404) echo '{}' > /tmp/release.json ;;
            *)
              echo "::error::Release lookup failed (HTTP $http_code). Refusing to build."
              exit 1
              ;;
          esac
          python3 scripts/plan_updates.py \
            --metadata /tmp/supported.json --release /tmp/release.json \
            --output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"

  build:
    name: Patch ${{ matrix.app }}
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.check.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve pinned Stable target
        id: plan
        shell: bash
        env:
          APP: ${{ matrix.app }}
          TARGETS_JSON: ${{ needs.check.outputs.targets }}
          PATCHES_TAG: ${{ needs.check.outputs.patches_tag }}
        run: |
          set -euo pipefail
          version="$(jq -er --arg app "$APP" '.[$app]' <<< "$TARGETS_JSON")"
          slug="${version//./-}"
          case "$APP" in
            youtube)
              url="https://www.apkmirror.com/apk/google-inc/youtube/youtube-${slug}-release/"
              ;;
            youtube-music)
              if [[ "$version" == "9.20.53" ]]; then
                url="https://www.apkmirror.com/apk/google-inc/youtube-music/youtube-music-9-20-53-release/youtube-music-9-20-53-4-android-apk-download/"
              else
                url="https://www.apkmirror.com/apk/google-inc/youtube-music/youtube-music-${slug}-release/"
              fi
              ;;
            *) echo "::error::Unsupported $APP"; exit 2 ;;
          esac
          echo "should_build=true" >> "$GITHUB_OUTPUT"
          echo "source_url=$url" >> "$GITHUB_OUTPUT"
          echo "target_version=$version" >> "$GITHUB_OUTPUT"
          echo "patches_tag=$PATCHES_TAG" >> "$GITHUB_OUTPUT"
      - name: Setup Java 21
        if: steps.plan.outputs.should_build == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Resolve and download source
        if: steps.plan.outputs.should_build == 'true'
        id: source
        shell: bash
        env:
          APP: ${{ matrix.app }}
          SOURCE_URL: ${{ steps.plan.outputs.source_url }}
        run: |
          set -euo pipefail
          python3 scripts/fetch_source.py "$SOURCE_URL" \
            --output-dir input \
            --name "$APP-original" | tee source.env
          cat source.env >> "$GITHUB_OUTPUT"
          source source.env
          sha256sum "$SOURCE_FILE"
          ls -lh "$SOURCE_FILE"

      - name: Patch with latest Morphe release
        if: steps.plan.outputs.should_build == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APP: ${{ matrix.app }}
          SOURCE_FILE: ${{ steps.source.outputs.SOURCE_FILE }}
          JAVA_XMX: 6g
          EXPECTED_PATCHES_TAG: ${{ needs.check.outputs.patches_tag }}
          EXPECTED_APP_VERSION: ${{ steps.plan.outputs.target_version }}
        run: bash scripts/build.sh

      - name: Read build metadata
        if: steps.plan.outputs.should_build == 'true'
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          cat dist/build-info.env >> "$GITHUB_OUTPUT"

      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Morphe CorePatch'
            if [[ "${{ steps.plan.outcome }}" != "success" ]]; then
              echo '❌ Không xác định được phiên bản Stable cần build.'
              echo 'Xem bước Resolve build target để biết lỗi API hoặc dữ liệu upstream.'
            elif [[ "${{ steps.plan.outputs.should_build }}" != "true" ]]; then
              echo '### ✅ KHÔNG CÓ CẬP NHẬT STABLE'
              echo
              echo 'APK Stable đúng phiên bản và Morphe patch đã có trong release.'
              echo '**Không cần build lại hoặc tạo release mới.**'
              echo
              echo '- App: `${{ matrix.app }}`'
              echo '- Stable đang được upstream khuyến nghị: `${{ steps.plan.outputs.target_version }}`'
              echo '- Morphe patches: `${{ steps.plan.outputs.patches_tag }}`'
              echo '- Release hiện có: [`${{ steps.plan.outputs.release_tag }}`](../../releases/tag/${{ steps.plan.outputs.release_tag }})'
              echo '- Khuôn dạng APK hiện có: `<App>-${{ steps.plan.outputs.target_version }}-morphe-${{ steps.plan.outputs.patches_tag }}-DDMMYY.apk`'
              echo '- Lý do skip: `asset-exists`'
              echo
              echo '> Các bản Experimental không được tự động build.'
            elif [[ -f dist/build-info.txt ]]; then
              echo '✅ Build succeeded'
              echo
              echo '### Build info'
              echo '~~~'
              cat dist/build-info.txt
              echo '~~~'
              echo
              echo 'Package, original certificate identity and original launcher icon are preserved.'
            else
              echo '❌ Build failed before a verified APK was produced.'
              echo
              echo 'Scheduled builds will retry on the next daily check.'
              echo 'Check SUPPORTED.md and APKMirror availability for the selected stable target.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ steps.plan.outcome }}" == "success" &&
                "${{ steps.plan.outputs.should_build }}" == "false" ]]; then
            echo "::notice title=No Stable update::${{ matrix.app }} Stable ${{ steps.plan.outputs.target_version }} already exists in ${{ steps.plan.outputs.release_tag }}; build skipped."
          fi

      - name: Upload Actions artifact
        if: success() && steps.plan.outputs.should_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.APP_SLUG }}-${{ steps.meta.outputs.APP_VERSION }}-Morphe
          path: dist/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Upload diagnostics
        if: failure() && steps.plan.outputs.should_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics-${{ matrix.app }}
          path: |
            source.env
            work/patch.log
            work/report.json
            work/support.json
          retention-days: 3
          if-no-files-found: ignore

  publish:
    name: Publish changed Stable APKs only
    needs: [check, build]
    if: needs.check.outputs.should_build == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download APK artifacts from this run
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Verify artifacts and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MODE: ${{ needs.check.outputs.mode }}
          EXPECTED_APPS_JSON: ${{ needs.check.outputs.apps }}
          EXPECTED_TARGETS_JSON: ${{ needs.check.outputs.targets }}
          EXPECTED_PATCHES_TAG: ${{ needs.check.outputs.patches_tag }}
          EXPECTED_RELEASE_TAG: ${{ needs.check.outputs.release_tag }}
        run: bash scripts/publish_release.sh
