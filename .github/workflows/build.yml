name: Build YouTube Morphe
run-name: Build YouTube from URL

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build.yml'
      - 'scripts/**'
      - 'config/**'
      - 'README.md'
  workflow_dispatch:
    inputs:
      source_url:
        description: Direct APK/APKM link or any YouTube page on apkmirror.com
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: morphe-youtube-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/build.sh
          python3 -m py_compile scripts/apk_sigblock.py
          python3 -m py_compile scripts/fetch_source.py
          python3 -m py_compile scripts/update_supported.py
          grep -F '"GmsCore support"' scripts/build.sh
          grep -F '"Spoof signature"' scripts/build.sh
          grep -F '"Custom branding"' scripts/build.sh

  build:
    name: Patch YouTube
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Resolve and download YouTube source
        id: source
        shell: bash
        env:
          SOURCE_URL: ${{ inputs.source_url }}
        run: |
          set -euo pipefail
          python3 scripts/fetch_source.py "$SOURCE_URL" --output-dir input | tee source.env
          cat source.env >> "$GITHUB_OUTPUT"
          source source.env
          sha256sum "$SOURCE_FILE"
          ls -lh "$SOURCE_FILE"

      - name: Patch with latest Morphe release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_FILE: ${{ steps.source.outputs.SOURCE_FILE }}
          JAVA_XMX: 6g
        run: bash scripts/build.sh

      - name: Read build metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          cat dist/build-info.env >> "$GITHUB_OUTPUT"

      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo '## YouTube Morphe CorePatch'
            if [[ -f dist/build-info.txt ]]; then
              echo '✅ Build succeeded'
              echo
              echo '### Build info'
              echo '```'
              cat dist/build-info.txt
              echo '```'
              echo
              echo 'See **SUPPORTED.md** in the repository for the current Morphe-supported YouTube versions.'
            else
              echo '❌ Build failed before a verified APK was produced.'
              echo
              echo 'Check **SUPPORTED.md** to make sure the selected YouTube version is supported by the latest Morphe patches.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Actions artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-${{ steps.meta.outputs.YOUTUBE_VERSION }}-Morphe
          path: dist/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Create or update GitHub Release
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          YOUTUBE_VERSION: ${{ steps.meta.outputs.YOUTUBE_VERSION }}
          EXPERIMENTAL: ${{ steps.meta.outputs.EXPERIMENTAL }}
          MORPHE_PATCHES_TAG: ${{ steps.meta.outputs.MORPHE_PATCHES_TAG }}
          MORPHE_DESKTOP_TAG: ${{ steps.meta.outputs.MORPHE_DESKTOP_TAG }}
          SOURCE_SHA256: ${{ steps.meta.outputs.SOURCE_SHA256 }}
          APK_SHA256: ${{ steps.meta.outputs.APK_SHA256 }}
        run: |
          set -euo pipefail

          patch_version="${MORPHE_PATCHES_TAG#v}"
          tag="youtube-${YOUTUBE_VERSION}-morphe-${patch_version}"
          title="YouTube ${YOUTUBE_VERSION} • Morphe ${MORPHE_PATCHES_TAG}"

          status="Stable"
          if [[ "$EXPERIMENTAL" == "true" ]]; then
            status="Experimental"
          fi

          cat > release-notes.md <<EOF
          ## YouTube ${YOUTUBE_VERSION}

          - Morphe patches: **${MORPHE_PATCHES_TAG}** (latest at build time)
          - Morphe Desktop: **${MORPHE_DESKTOP_TAG}**
          - Morphe support status: **${status}**
          - Package: `com.google.android.youtube`
          - Icon: original YouTube
          - GmsCore support: OFF
          - Spoof signature: OFF
          - Custom branding: OFF
          - CorePatch/signature-verification bypass: **required**
          - Source SHA-256: `${SOURCE_SHA256}`
          - Output SHA-256: `${APK_SHA256}`

          The source APK is not stored in this repository.
          EOF

          prerelease_args=()
          if [[ "$EXPERIMENTAL" == "true" ]]; then
            prerelease_args+=(--prerelease)
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$title" --notes-file release-notes.md
            gh release upload "$tag"               dist/*.apk               dist/*-report.json               dist/*.sha256               dist/build-info.txt               dist/SUPPORTED.md               --clobber
          else
            gh release create "$tag"               dist/*.apk               dist/*-report.json               dist/*.sha256               dist/build-info.txt               dist/SUPPORTED.md               --target "$GITHUB_SHA"               --title "$title"               --notes-file release-notes.md               "${prerelease_args[@]}"
          fi

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            source.env
            work/patch.log
            work/report.json
            work/support.json
          retention-days: 3
          if-no-files-found: ignore
