name: Sync Morphe supported versions

on:
  schedule:
    - cron: '23 3 * * *'
  push:
    branches:
      - main
    paths:
      - 'scripts/update_supported.py'
      - '.github/workflows/sync-supported.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate SUPPORTED.md from latest Morphe release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_supported.py --output SUPPORTED.md

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- SUPPORTED.md; then
            echo "SUPPORTED.md is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SUPPORTED.md
          git commit -m "docs: sync Morphe supported YouTube versions"
          git push
