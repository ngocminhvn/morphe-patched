name: Publish Morphe Releases
run-name: Publish bundle from build #${{ github.event.workflow_run.run_number }}

on:
  workflow_run:
    workflows:
      - Morphe Multi-App Builder
    types:
      - completed

permissions:
  actions: read
  contents: write

concurrency:
  group: morphe-publish-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish combined APK release
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --dir artifacts || true
          find artifacts -maxdepth 3 -type f -print | sort

      - name: Publish combined release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          mapfile -t infos < <(find artifacts -type f -name build-info.env -print | sort)
          if (( ${#infos[@]} == 0 )); then
            echo "No build-info.env found; nothing to publish."
            exit 0
          fi

          read_value() {
            local key="$1" file="$2"
            sed -n "s/^${key}=//p" "$file" | head -n1
          }

          first_info="${infos[0]}"
          MORPHE_PATCHES_TAG="$(read_value MORPHE_PATCHES_TAG "$first_info")"
          MORPHE_DESKTOP_TAG="$(read_value MORPHE_DESKTOP_TAG "$first_info")"
          test -n "$MORPHE_PATCHES_TAG"
          test -n "$MORPHE_DESKTOP_TAG"

          for info in "${infos[@]}"; do
            test "$(read_value MORPHE_PATCHES_TAG "$info")" = "$MORPHE_PATCHES_TAG"
          done

          patch_version="${MORPHE_PATCHES_TAG#v}"
          tag="morphe-${patch_version}"
          title="Morphe Patched ${MORPHE_PATCHES_TAG}"

          declare -a all_apks=()
          for info in "${infos[@]}"; do
            dir="$(dirname "$info")"
            apks=("$dir"/*.apk)
            if (( ${#apks[@]} != 1 )); then
              echo "Expected exactly one APK in $dir, found ${#apks[@]}" >&2
              exit 3
            fi
            all_apks+=("${apks[0]}")
          done

          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if (( ${#all_apks[@]} != 3 )); then
              echo "Refusing to create incomplete bundle $tag: expected 3 APKs, found ${#all_apks[@]}."
              exit 0
            fi

            notes="$(mktemp)"
            printf '%s\n' \
              "- Morphe patches: **${MORPHE_PATCHES_TAG}**" \
              "- Morphe Desktop: **${MORPHE_DESKTOP_TAG}**" \
              "- Bundle: **YouTube + YouTube Music + Reddit**" \
              > "$notes"

            gh release create "$tag" "${all_apks[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET_BRANCH" \
              --title "$title" \
              --notes-file "$notes"
          else
            for info in "${infos[@]}"; do
              dir="$(dirname "$info")"
              APP_KEY="$(read_value APP_KEY "$info")"
              apks=("$dir"/*.apk)
              apk="${apks[0]}"
              keep_asset="$(basename "$apk")"

              case "$APP_KEY" in
                youtube) prefix="Youtube-" ;;
                youtube-music) prefix="YoutubeMusic-" ;;
                reddit) prefix="Reddit-" ;;
                *)
                  echo "Unknown APP_KEY in $info: $APP_KEY" >&2
                  exit 2
                  ;;
              esac

              gh release upload "$tag" "$apk" --repo "$GITHUB_REPOSITORY" --clobber

              while IFS= read -r asset; do
                [[ -z "$asset" || "$asset" == "$keep_asset" ]] && continue
                [[ "$asset" == "$prefix"* ]] || continue
                gh release delete-asset "$tag" "$asset" \
                  --repo "$GITHUB_REPOSITORY" --yes
              done < <(gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
                --json assets --jq '.assets[].name')
            done
          fi

          notes="$(mktemp)"
          {
            echo "- Morphe patches: **${MORPHE_PATCHES_TAG}**"
            echo "- Morphe Desktop: **${MORPHE_DESKTOP_TAG}**"
            echo "- Bundle: **YouTube + YouTube Music + Reddit**"
            echo
            echo "### APKs"
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
              --json assets --jq '.assets[].name' | sort | sed 's/^/- `/; s/$/`/'
          } > "$notes"

          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
            --title "$title" \
            --notes-file "$notes"
