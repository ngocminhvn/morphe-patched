name: Publish Morphe Releases
run-name: Publish bundle from build #${{ github.event.workflow_run.run_number }}

on:
  workflow_run:
    workflows:
      - Morphe Multi-App Builder
    types:
      - completed

permissions:
  actions: read
  contents: write

concurrency:
  group: morphe-publish-releases
  cancel-in-progress: false

jobs:
  publish:
    name: Publish combined APK release
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p artifacts

          # "No artifacts" is valid when all Stable APKs already exist.
          # An actual GitHub API/download failure must not be disguised as
          # a successful no-update run.
          available="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" \
            --jq '[.artifacts[] | select(.expired == false)] | length')"
          if (( available > 0 )); then
            gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --dir artifacts
          else
            echo "Build #$RUN_ID produced no artifacts (normal for unchanged Stable versions)."
          fi
          find artifacts -maxdepth 3 -type f -print | sort

      - name: Publish combined release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
          SOURCE_EVENT: ${{ github.event.workflow_run.event }}
          SOURCE_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          mapfile -t infos < <(find artifacts -type f -name build-info.env -print | sort)
          if (( ${#infos[@]} == 0 )); then
            if [[ "$SOURCE_EVENT" == "schedule" ]]; then
              reason="Không có cập nhật Stable mới — cả ba APK đã tồn tại, không tạo release."
              echo "::notice title=No new Stable release::$reason"
            elif [[ "$SOURCE_EVENT" == "push" ]]; then
              reason="Chỉ kiểm tra mã nguồn (push), không có yêu cầu build APK."
              echo "::notice title=Validation only::No release needed for push checks."
            else
              reason="Không có APK từ build được kích hoạt thủ công; kiểm tra workflow nguồn."
              echo "::warning title=No APK to publish::$reason"
            fi
            {
              echo "## Kết quả phát hành Morphe"
              echo
              echo "**$reason**"
              echo
              echo "- Workflow nguồn: $SOURCE_RUN_URL"
              echo "- Release hiện tại: https://github.com/$GITHUB_REPOSITORY/releases/latest"
              echo
              echo "> Không tự tạo release rỗng và không phát hành bản Experimental."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          read_value() {
            local key="$1" file="$2"
            sed -n "s/^${key}=//p" "$file" | head -n1
          }

          first_info="${infos[0]}"
          MORPHE_PATCHES_TAG="$(read_value MORPHE_PATCHES_TAG "$first_info")"
          MORPHE_DESKTOP_TAG="$(read_value MORPHE_DESKTOP_TAG "$first_info")"
          test -n "$MORPHE_PATCHES_TAG"
          test -n "$MORPHE_DESKTOP_TAG"

          for info in "${infos[@]}"; do
            test "$(read_value MORPHE_PATCHES_TAG "$info")" = "$MORPHE_PATCHES_TAG"
          done

          tag="morphe-${MORPHE_PATCHES_TAG#v}"
          title="Morphe Patched ${MORPHE_PATCHES_TAG}"

          declare -a all_apks=()
          for info in "${infos[@]}"; do
            dir="$(dirname "$info")"
            apks=("$dir"/*.apk)
            if (( ${#apks[@]} != 1 )); then
              echo "Expected exactly one APK in $dir, found ${#apks[@]}" >&2
              exit 3
            fi
            all_apks+=("${apks[0]}")
          done

          # One release PER Morphe patches version:
          # - New patch tag: create a brand-new COMPLETE three-app bundle.
          # - Existing patch tag: replace only APKs built in this run.
          # Releases of older Morphe versions remain untouched.
          created_new_release=false
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag exists: update only rebuilt app APK(s)."
          else
            if (( ${#infos[@]} != 3 )); then
              echo "::error::Cannot create $tag: new Morphe version requires 3 APKs, found ${#infos[@]}."
              exit 3
            fi
            declare -A seen=()
            for info in "${infos[@]}"; do
              key="$(read_value APP_KEY "$info")"
              case "$key" in
                youtube|youtube-music|reddit) ;;
                *) echo "::error::Invalid app in new release: $key"; exit 3 ;;
              esac
              if [[ -n "${seen[$key]:-}" ]]; then
                echo "::error::Duplicate app in new release: $key"
                exit 3
              fi
              seen[$key]=1
            done
            for key in youtube youtube-music reddit; do
              [[ -n "${seen[$key]:-}" ]] || { echo "::error::Missing $key in new Morphe release"; exit 3; }
            done

            notes="$(mktemp)"
            printf '%s\n' \
              "- Morphe patches: **${MORPHE_PATCHES_TAG}**" \
              "- Morphe Desktop: **${MORPHE_DESKTOP_TAG}**" \
              "- Bundle: **YouTube + YouTube Music + Reddit (Stable)**" \
              > "$notes"
            gh release create "$tag" "${all_apks[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET_BRANCH" \
              --title "$title" \
              --notes-file "$notes"
            created_new_release=true
            echo "Created complete new release $tag with all three Stable APKs."
          fi

          # Do not reupload after creation; for a pre-existing release replace
          # only the modified app and delete its previous APK after upload.
          if [[ "$created_new_release" == "false" ]]; then
          for info in "${infos[@]}"; do
            dir="$(dirname "$info")"
            APP_KEY="$(read_value APP_KEY "$info")"
            apks=("$dir"/*.apk)
            if (( ${#apks[@]} != 1 )); then
              echo "::error::Expected one APK in $dir, got ${#apks[@]}."
              exit 3
            fi
            apk="${apks[0]}"
            keep_asset="$(basename "$apk")"

            case "$APP_KEY" in
              youtube) prefix="Youtube-" ;;
              youtube-music) prefix="YoutubeMusic-" ;;
              reddit) prefix="Reddit-" ;;
              *)
                echo "::error::Unknown APP_KEY: $APP_KEY"
                exit 2
                ;;
            esac

            # Only delete obsolete versions for THIS app AFTER its new APK
            # was successfully uploaded. Includes old NeedCorePatch assets.
            echo "Updating $APP_KEY -> $keep_asset in existing release $tag"
            gh release upload "$tag" "$apk" --repo "$GITHUB_REPOSITORY" --clobber

            mapfile -t present < <(gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
              --json assets --jq '.assets[].name')
            for asset in "${present[@]}"; do
              [[ "$asset" == "$keep_asset" ]] && continue
              [[ "$asset" == "$prefix"* && "$asset" == *.apk ]] || continue
              gh release delete-asset "$tag" "$asset" \
                --repo "$GITHUB_REPOSITORY" --yes
            done
          done
          fi

          notes="$(mktemp)"
          {
            echo "- Morphe patches: **${MORPHE_PATCHES_TAG}**"
            echo "- Morphe Desktop: **${MORPHE_DESKTOP_TAG}**"
            echo "- Bundle: **YouTube + YouTube Music + Reddit**"
            echo
            echo "### APKs"
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
              --json assets --jq '.assets[].name' | sort | sed 's/^/- `/; s/$/`/'
          } > "$notes"

          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
            --title "$title" \
            --notes-file "$notes"

          {
            echo "## Phát hành Stable thành công"
            echo
            echo "- Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag"
            echo "- Morphe patches: `$MORPHE_PATCHES_TAG`"
            echo "- Số APK từ lượt build này: ${#all_apks[@]}"
            echo "- Tạo Release mới: $created_new_release"
            echo "- Workflow nguồn: $SOURCE_RUN_URL"
            echo
            echo "### APK hiện có trong release"
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
              --json assets --jq '.assets[].name' | sort | sed 's/^/- `/; s/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"
